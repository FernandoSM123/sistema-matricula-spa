<button mat-button type="button" class="cuenta" [matMenuTriggerFor]="menu">
  @if (sesion.nombre(); as nombre) {
    <span class="nombre">{{ nombre }}</span>
  }
  <span class="rol">{{ sesion.rol() | etiqueta: 'rol' }}</span>
</button>

<mat-menu #menu="matMenu" xPosition="before">
  @for (opcion of opciones; track opcion.ruta) {
    <a mat-menu-item [routerLink]="opcion.ruta">{{ opcion.etiqueta }}</a>
  }
  <mat-divider />
  <button mat-menu-item type="button" (click)="cerrarSesion()">
    <mat-icon svgIcon="salir" aria-hidden="true" />
    <span>Cerrar sesión</span>
  </button>
</mat-menu>
